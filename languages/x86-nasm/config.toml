name = "x86 Assembly (NASM)"
grammar = "asm_x86_nasm"
path_suffixes = ["asm", "ASM", "nasm", "yasm"]
modeline_aliases = ["nasm", "yasm"]
line_comments = ["; "]
autoclose_before = ",;)]}"
brackets = [
  { start = "{", end = "}", close = true, newline = false },
  { start = "[", end = "]", close = true, newline = false },
  { start = "(", end = ")", close = true, newline = false },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
  { start = "`", end = "`", close = true, newline = false, not_in = ["string"] },
  { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
]
word_characters = [".", "$", "%", "?", "@", "#"]
increase_indent_pattern = "^\\s*[A-Za-z_.?$@][A-Za-z0-9_$#@~.?]*:"
decrease_indent_pattern = "^\\s*[A-Za-z_.?$@][A-Za-z0-9_$#@~.?]*:"
debuggers = ["CodeLLDB", "GDB"]
