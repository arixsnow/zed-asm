name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build the toolchain image
        run: scripts/dev true

      - name: Test
        run: scripts/dev deno task test

      - name: Sanitizers
        run: scripts/dev deno task sanitize
